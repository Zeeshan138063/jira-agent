[project]
name = "jira-agent"
version = "0.9.0"
description = "Claude Code agent for Jira ticket creation, grooming, dedupe and knowledge-base upkeep"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zeeshan Muhammad" }]
keywords = ["jira", "claude-code", "plugin"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "keyring>=25.0",
]

[project.urls]
Repository = "https://github.com/Zeeshan138063/jira-agent"
Homepage = "https://github.com/Zeeshan138063/jira-agent"

[project.scripts]
jira-agent = "jira_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
